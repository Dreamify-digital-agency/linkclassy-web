<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LinkClassy — Welcome</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&family=Cormorant+Garamond:wght@300;400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#070707;color:#EAD9B0;font-family:'Cormorant Garamond',Georgia,serif;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center}
.wrap{max-width:480px;padding:2rem}
.orn{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:2.5rem}.orn::before,.orn::after{content:'';height:1px;width:45px;background:linear-gradient(90deg,transparent,rgba(214,168,90,.3))}.orn::after{background:linear-gradient(270deg,transparent,rgba(214,168,90,.3))}.orn-d{width:4px;height:4px;border-radius:50%;background:#D6A85A;opacity:.4}
h1{font-family:'Playfair Display',Georgia,serif;font-size:clamp(2.5rem,6vw,4rem);font-weight:400;margin-bottom:1rem;line-height:1.1}
h1 em{font-style:italic;color:#D6A85A}
p{color:rgba(234,217,176,0.65);font-size:1.1rem;line-height:1.7;font-weight:300;margin-bottom:2.5rem}
a{display:inline-block;padding:.9rem 2.5rem;border-radius:50px;color:#D6A85A;font-family:'Playfair Display',Georgia,serif;font-size:.95rem;text-decoration:none;letter-spacing:.14em;border:1px solid rgba(214,168,90,.3);background:linear-gradient(135deg,rgba(214,168,90,.06),transparent 60%);transition:all .5s}
a:hover{border-color:#D6A85A;color:#EAD9B0}
</style>
</head>
<body>
<div class="wrap">
  <div class="orn"><div class="orn-d"></div></div>
  <h1>You're on the <em>list.</em></h1>
  <p>We'll be in touch when your spot opens. Good things take time.</p>
  <a href="/">Back to LinkClassy</a>
</div>
</body>
</html>
